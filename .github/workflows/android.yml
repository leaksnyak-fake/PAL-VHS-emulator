name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: '28.0.13004108'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          bash ./gradlew :app:assembleDebug --no-daemon
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: pal-vhs-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
